<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Iron Pig">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2a2220">
    <title>404 | Iron Pig</title>
    <link rel="icon" type="image/svg+xml" href="/iron_pig_mark.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'adineue PRO';
            src: url('/fonts/adineue-pro-regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'adineue PRO', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 30px,
                    rgba(190, 180, 165, 0.8) 30px,
                    rgba(190, 180, 165, 0.8) 32px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 118px,
                    rgba(190, 180, 165, 0.7) 118px,
                    rgba(190, 180, 165, 0.7) 120px
                ),
                linear-gradient(180deg, #ddd0bc 0%, #d1c4af 100%);
        }

        .board {
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            background:
                radial-gradient(circle at 30% 40%, rgba(255,255,255,0.03) 0%, transparent 50%),
                linear-gradient(135deg, #2a2520 0%, #1f1d1a 100%);
            border: 8px solid #8B6F47;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .board__code {
            font-family: 'Pacifico', cursive;
            font-size: 72px;
            color: #f5f5dc;
            text-shadow:
                0 0 10px #fff,
                0 0 20px #b5c99a,
                0 0 30px #97a97c;
            margin-bottom: 12px;
        }

        .board__title {
            font-size: 22px;
            font-weight: bold;
            color: #f5f5f5;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .board__text {
            font-size: 15px;
            line-height: 1.6;
            color: #EDE4CC;
            margin-bottom: 28px;
        }

        .board__link {
            display: inline-block;
            padding: 12px 28px;
            background: #2E5E3F;
            color: #f5f5f5;
            text-decoration: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .board__link:hover {
            background: #3d6e45;
            transform: translateY(-1px);
        }

        .board__link:focus-visible {
            outline: 2px solid #b5c99a;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="board">
        <div class="board__code">404</div>
        <h1 class="board__title">This table's free</h1>
        <p class="board__text">
            Whatever you ordered isn't on the menu. The page may have moved, or the URL has a typo in it.
        </p>
        <a href="/" class="board__link">Back to the caf&eacute; &rarr;</a>
    </main>
</body>
</html>
